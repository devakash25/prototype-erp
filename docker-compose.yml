version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dev-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dev_erp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dev-erp-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dev-erp-server
    restart: unless-stopped
    ports:
      - '5002:5000'
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/dev_erp?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-erp-super-secret-key-change-in-production-2024
      JWT_REFRESH_SECRET: dev-erp-refresh-secret-key-change-in-production-2024
      NODE_ENV: production
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: dev-erp-client
    restart: unless-stopped
    ports:
      - '3001:80'
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    container_name: dev-erp-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - server
      - client

volumes:
  postgres_data:
  redis_data:
