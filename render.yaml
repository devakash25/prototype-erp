services:
  # ---- Backend API (Docker) ----
  - type: web
    name: dev-erp-api
    runtime: docker
    plan: starter
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 5000
      - key: APP_URL
        sync: false
    healthCheckPath: /health
    autoDeploy: true

  # ---- Frontend (Docker) ----
  - type: web
    name: dev-erp-client
    runtime: docker
    plan: starter
    dockerfilePath: ./client/Dockerfile
    dockerContext: ./client
    envVars:
      - key: VITE_API_URL
        value: /api/v1
    autoDeploy: true
