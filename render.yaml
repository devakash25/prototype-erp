services:
  # ---- Backend API (Node.js Free Tier) ----
  - type: web
    name: dev-erp-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 5000
      - key: APP_URL
        sync: false
    healthCheckPath: /health
    autoDeploy: true

  # ---- Frontend (Static Site - Free) ----
  - type: static_site
    name: dev-erp-client
    plan: free
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: /api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
