services:
  # ---- Backend API ----
  - type: web
    name: dev-erp-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 5000
      - key: APP_URL
        sync: false
    healthCheckPath: /health
    autoDeploy: true

  # ---- Frontend (Static Site) ----
  - type: static_site
    name: devschoolerp
    runtime: static
    plan: free
    staticPublishPath: ./client/dist
    buildCommand: cd client && npm install --include=dev && npm run build
    envVars:
      - key: VITE_API_URL
        sync: false
    autoDeploy: true
